<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Animal-le</title>
   <h1><center>WELCOME TO ANIMAL-LE</center></h1>
    <style>
        h1 {
            font-size: 60px;
        }

        .infoBox {
            height: 200px;
            width: 25%;
            background-color: grey;
            margin-right: 5px;
            margin-left: 5px;
            transition: all 0.5s ease;
            border: 1px solid black;
            border-radius: 10px; 
            display: flex;
            justify-content: center; 
            /* text-align: center; */
            /* align-items: center;     /* Centers vertically */
            padding: 10px;
            box-sizing: border-box;
        }

        .infoBox:hover {
            background-color: lightgray;
        }

        .boxContainer {
            display: flex;
            width: 50%;
            margin: auto;
            /* border: 4px solid purple; */
            height: 300px;
            justify-content: center;
            align-items: center;
        }

        .answer {
            font-size: 20px;
            text-align: center;
        }

        #currGuess::placeholder {
            color: black;
        }

        .failure-placeholder::placeholder {
            color: red !important;
        }

        .success-placeholder::placeholder {
            color: green !important;
        }
    </style>
</head>

<body>
    <div for="start" id="start" > 
    <label for="currGuess">Choose an animal:</label>
    <input type="text" id="currGuess" name="currGuess" placeholder="Enter" autocomplete="off">
    <button id="guessButton" onclick="checkAnswer()">Enter</button>
    </div>
    <script src=script.js></script>


</body>
